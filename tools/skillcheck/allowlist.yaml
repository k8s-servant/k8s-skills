# Read-only commands a skill may tell the agent to run freely. Extend only by PR review.
commands:
  kubectl: [get, describe, logs, events, top, explain, api-resources, api-versions,
            version, cluster-info, "auth can-i", "auth whoami", "rollout status", "rollout history"]
  # Azure CLI, for the AKS skill: only show/list/get commands, which change nothing. Not
  # here on purpose: get-credentials (writes a kubeconfig with credentials), command
  # invoke (runs commands in the cluster), check-acr and kollect (run pods), and anything
  # that reads Key Vault or other secrets. Changes are proposed fixes, never ask-first.
  az: ["aks show", "aks list", "aks operation show-latest", "aks get-upgrades", "aks get-versions", "aks nodepool list",
       "aks nodepool show", "aks nodepool get-upgrades", "aks addon list",
       "network lb show", "network lb list", "network lb probe list", "network lb rule list",
       "network lb frontend-ip list", "network public-ip show", "network public-ip list",
       "network nsg show", "network nsg list", "network nsg rule list",
       "network vnet subnet show", "network vnet subnet list", "network nic show",
       "vmss list", "vmss show", "vmss list-instances", "vmss get-instance-view",
       "vm list-usage", "disk show", "disk list", "monitor activity-log list",
       "identity show", "identity list", "identity federated-credential list",
       "role assignment list", "account show"]
# Flags an az command may use; any other flag is a finding. An argument starting with `@`
# would make az read it from a local file, so it is a finding too.
az_flags: [-g, --resource-group, -n, --name, --cluster-name, --nodepool-name, --lb-name,
           --vnet-name, --nsg-name, --identity-name, --instance-id, --query, -o, --output,
           --subscription, --offset, --start-time, --end-time, --status, --max-events, -l,
           --location, --assignee, --scope, --all, --include-inherited, --ids,
           --only-show-errors]
# Every top-level kubectl command (`kubectl --help` of kubectl v1.37, plus `options` and
# `help`; plugins left out).
# In prose, `kubectl <word>` is only treated as a command when <word> is one of these,
# so a bare mention such as "the `kubectl` binary" or "kubectl tool" is not a finding.
kubectl_commands: [create, expose, run, set, explain, get, edit, delete, rollout, scale,
                   autoscale, certificate, cluster-info, top, cordon, uncordon, drain, taint,
                   describe, logs, attach, exec, port-forward, proxy, cp, auth, debug, events,
                   diff, apply, patch, replace, wait, kustomize, label, annotate, completion,
                   api-resources, api-versions, config, kuberc, plugin, version, options,
                   help]
filters: [grep, egrep, jq, yq, sort, uniq, head, tail, wc, cut, column]
# Flags each filter may use; any other flag is a finding. Filters read stdin only.
filter_flags:
  grep: [-i, -v, -E, -w, -c, -n, -o, -F, -e, -A, -B, -C, --ignore-case, --invert-match,
         --extended-regexp, --word-regexp, --count, --line-number, --only-matching, --fixed-strings]
  egrep: [-i, -v, -E, -w, -c, -n, -o, -F, -e, -A, -B, -C, --ignore-case, --invert-match,
          --extended-regexp, --word-regexp, --count, --line-number, --only-matching, --fixed-strings]
  jq: [-r, -c, -e, -s, --raw-output, --compact-output, --exit-status, --slurp, --arg]
  yq: [-r, -o, -e, --output-format]
  sort: [-n, -r, -k, -t, -h, -u, -V]
  uniq: [-c, -d, -u]
  head: [-n]
  tail: [-n]
  wc: [-l, -c, -w, -m]
  cut: [-d, -f, -c]
  column: [-t, -s]
# kubectl global flags (from `kubectl options`). Only the allowed ones may be used, and
# only -n/--namespace may come before the subcommand; every other global flag can change
# the identity, the target server or local files.
global_flags_allowed: [-n, --namespace, --request-timeout, -v, --v]
global_flags: [-n, -s, -v, --as, --as-group, --as-uid, --as-user-extra, --cache-dir,
               --certificate-authority, --client-certificate, --client-key, --cluster, --context,
               --disable-compression, --insecure-skip-tls-verify, --kubeconfig, --kuberc,
               --log-flush-frequency, --match-server-version, --namespace, --password, --profile,
               --profile-output, --proxy-url, --request-timeout, --server, --tls-server-name,
               --token, --user, --username, --v, --vmodule, --warnings-as-errors]
# Global flags a run-freely subcommand may use after it. `auth can-i` only asks the API
# server a question, so it may ask it for another user or group; that needs the
# `impersonate` verb, which a read-only identity usually lacks.
subcommand_flags_allowed:
  "auth can-i": [--as, --as-group]
command_langs: [bash, sh, shell, console, zsh]
# Commands an agent may run only after the user approves each one, in a block directly
# under the ask-first marker. Extend only by PR review, like `commands`; never turn it
# into a deny-list. Every command here except exec changes the cluster, so a block with
# one needs an `# Undo:` line.
ask_first:
  kubectl: ["set image", "set resources", "rollout undo", "rollout restart", "rollout pause",
            "rollout resume", scale, patch, cordon, uncordon, label, annotate, taint, exec]
  # exec runs one read-only program in a container: no shell, no stdin or TTY.
  exec_flags: [-n, --namespace, -c, --container]
  # cilium-dbg, cilium-health and hubble run inside the Cilium agent pod, pilot-agent in
  # Istio's istio-proxy container (`pilot-agent request GET <admin path>` only). They also have
  # subcommands that change state, so skills use only reading ones (status, endpoint
  # list/get, policy get, hubble observe with --last or --since); reviewers check that.
  in_pod: [nslookup, dig, getent, curl, wget, cat, ls, ps, df, id, hostname, cilium-dbg,
           cilium-health, hubble, pilot-agent]
  # The user sees each ask-first command before it runs, so the program's arguments are
  # left to them and to review. Only Secret access is checked.

  # Programs that print the environment, matched as whole words.
  secret_words: [env, printenv]
  # Text that points at the environment, a token, password or credential file, a CSI
  # secrets mount, or the usual address of a cloud metadata endpoint (which hands out the
  # node's cloud credentials), matched anywhere in the command.
  secret_substrings: [environ, serviceaccount, token, password, credential, shadow,
                      secrets-store, 169.254.169.254, metadata.google.internal, fd00:ec2,
                      100.100.100.200]
