# Loaded by default by the `links` job in .github/workflows/ci.yml.

# docs.cilium.io answers 429 Too Many Requests when the CI runner sends its links in
# parallel, and the retries alone did not get past it: send them one at a time.
[hosts."docs.cilium.io"]
concurrency = 1
request_interval = "1s"

# github.com answers 503 to file and blob pages when the runner sends a burst of them
# (232 links here), most often when two merges start the link check back to back.
[hosts."github.com"]
concurrency = 2
request_interval = "250ms"
