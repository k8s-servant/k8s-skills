name: Claude

# Runs Claude when a maintainer mentions @claude in an issue, a PR comment or a review.
# Only the owner, members and collaborators can trigger it: anyone else's comment is
# untrusted input, and running a model on it with repository access is a
# prompt-injection risk. The action also checks that the actor has write access.
# Fork PRs are refused: the action would check out their code and hand it to a model
# holding a write token.
on:
  # zizmor: issue_comment is gated below on a trusted author and a same-repository PR,
  # and nothing from the event reaches a shell.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      (
        (
          github.event_name == 'issue_comment' ||
          (github.event_name == 'pull_request_review_comment' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        ) &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      # issue_comment does not carry the PR head repository, so ask the API.
      - name: Refuse fork PRs
        if: github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          fork=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$fork" != "false" ]; then
            echo "::error::PR #$PR is from a fork; @claude does not run on fork PRs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
