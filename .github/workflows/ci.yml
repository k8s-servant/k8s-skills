name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest

  skills:
    # The skill checker and the generated install manifests must agree with the skills.
    name: skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m tools.skillcheck check
      - run: python -m tools.skillcheck manifests --check
      # The release builds the zips the same way; exercise that path on every PR.
      - run: python -m tools.skillcheck package --out dist

  shell:
    name: shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck the test kit and scenarios
        run: shellcheck tests/*.sh tests/*/*/*.sh

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MARKDOWNLINT_CLI2_VERSION: 0.24.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"

  plugin:
    # `claude plugin validate` needs no API key: it only checks the manifests.
    name: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: 2.1.309
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate .

  links:
    name: links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The org allows only a fixed list of third-party actions, so lychee runs as a
      # release binary checked against a pinned SHA-256 (same pattern as gitleaks).
      - name: Install lychee (checksum verified)
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          tarball="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${tarball}"
          echo "${LYCHEE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
      # Retries ride out the occasional 503 or dropped connection; the token lets lychee
      # check github.com links through the API instead of hitting anonymous rate limits.
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./lychee --no-progress --scheme https --max-retries 5 --retry-wait-time 10
          --exclude-path docs/superpowers '**/*.md'

  result:
    # The one check the branch ruleset requires, so jobs can be added or renamed freely.
    name: CI result
    if: always()
    needs: [lint, test, skills, shell, markdown, plugin, links]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do [ "$r" = success ] || exit 1; done
