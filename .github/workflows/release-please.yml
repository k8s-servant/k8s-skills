name: Release

# release-please keeps a release PR open from Conventional Commit history. Merging it
# tags vX.Y.Z and creates the GitHub release; the zips job then attaches one zip per
# skill and a SHA256SUMS file to that release.
#
# release-please runs with a GitHub App token, not GITHUB_TOKEN: GitHub does not start
# workflows for events that GITHUB_TOKEN creates, so a release PR opened with it never
# gets the required checks and stays blocked. The App needs Contents, Pull requests and
# Issues (read and write) on this repository; its Client ID is the repository variable
# RELEASE_APP_CLIENT_ID and its private key the secret RELEASE_APP_PRIVATE_KEY.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions: {} # release-please uses the App token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  zips:
    name: attach skill zips
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          # No pip cache here: a cache written by another workflow must not feed a release.
      - run: pip install -r requirements-dev.txt
      - run: python -m tools.skillcheck package --out dist
      - name: Upload the zips and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" dist/* --clobber
